include: ../../analysis_options.yaml

# `flutter create --platforms=android` dropped its own template file here, which
# included `package:flutter_lints` directly and so silently opted this app out
# of the root's strict-casts/inference/raw-types. Keep the include above.
# The excludes are the ones `flutter create`/`flutter pub get` insist on; drop
# them and the tooling re-adds them in a dirty tree.
analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
