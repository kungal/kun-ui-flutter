# The Widgetbook app plays the role apps/docs plays in kun-ui: the component
# gallery during development (`flutter run`) AND the deployable docs surface
# (`flutter build web`) — one codebase, both jobs.
name: kun_ui_widgetbook
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kun_ui: ^0.1.0
  widgetbook: ^3.25.0

dev_dependencies:
  flutter_lints: ^6.0.0
